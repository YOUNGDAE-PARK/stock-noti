name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Create Production .env file
        run: |
          echo "DATABASE_PATH=/tmp/stock_noti.db" >> .env
          echo "REPORTS_DIR=/tmp/reports" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}" >> .env
          echo "DART_API_KEY=${{ secrets.DART_API_KEY }}" >> .env
          echo "NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}" >> .env
          echo "NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}" >> .env
          echo "KRX_API_KEY=${{ secrets.KRX_API_KEY }}" >> .env

      - name: Deploy to Firebase
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "### ❌ ERROR: FIREBASE_SERVICE_ACCOUNT_JSON secret is not set in GitHub!" >> $GITHUB_STEP_SUMMARY
            echo "Please register the service account JSON key as a GitHub Secret named \`FIREBASE_SERVICE_ACCOUNT_JSON\`." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/service-account.json
          
          # Run deployment and capture both stdout and stderr
          echo "Starting Firebase deployment..."
          npx firebase-tools deploy --non-interactive > deploy.log 2>&1
          status=$?
          
          # Output full log to runner stdout so it's in the step details
          cat deploy.log
          
          if [ $status -ne 0 ]; then
            echo "### ❌ Firebase Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "Here is the tail of the deployment log:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
            tail -n 40 deploy.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            exit $status
          else
            echo "### 🎉 Firebase Deployment Succeeded!" >> $GITHUB_STEP_SUMMARY
          fi


