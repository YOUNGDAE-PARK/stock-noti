name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Create Production .env file
        env:
          CONFIG_JSON: ${{ secrets.FIREBASE_CLIENT_CONFIG_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_WEEKLY_URL: ${{ secrets.SLACK_WEBHOOK_WEEKLY_URL }}
          SLACK_WEBHOOK_URGENT_URL: ${{ secrets.SLACK_WEBHOOK_URGENT_URL }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          echo "DATABASE_PATH=/tmp/stock_noti.db" >> .env
          echo "REPORTS_DIR=/tmp/reports" >> .env
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          echo "SLACK_WEBHOOK_URL=$SLACK_WEBHOOK_URL" >> .env
          echo "SLACK_WEBHOOK_WEEKLY_URL=$SLACK_WEBHOOK_WEEKLY_URL" >> .env
          echo "SLACK_WEBHOOK_URGENT_URL=$SLACK_WEBHOOK_URGENT_URL" >> .env
          echo "DART_API_KEY=$DART_API_KEY" >> .env
          echo "NAVER_CLIENT_ID=$NAVER_CLIENT_ID" >> .env
          echo "NAVER_CLIENT_SECRET=$NAVER_CLIENT_SECRET" >> .env
          echo "KRX_API_KEY=$KRX_API_KEY" >> .env
          
          # Create fb_config.js for direct injection (bypasses .gitignore issues)
          if [ ! -z "$CONFIG_JSON" ]; then
            echo "Injecting Firebase Config into fb_config.js..."
            echo "export default $CONFIG_JSON;" > src/services/fb_config.js
          fi

          # Verification Log (Masked)
          echo "--- Deployment Environment Summary ---"
          grep -v "KEY\|SECRET\|JSON\|ID" .env || true
          echo "FB_CLIENT_API_KEY is $(if [ -z "$(grep FB_CLIENT_API_KEY .env | cut -d= -f2)" ]; then echo 'EMPTY'; else echo 'PRESENT'; fi)"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}'

      - name: Deploy to Firebase
        run: |
          echo "Starting Firebase deployment with verbose logging..."
          npx firebase-tools deploy --non-interactive --project stock-f2ee7 --debug

      - name: Push Logs to git branch on failure
        if: failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b deploy-logs || git checkout deploy-logs
          if [ -f deploy.log ]; then
            cp deploy.log deploy-failed.log
            git add deploy-failed.log
            git commit -m "Chore: update deployment failure logs"
            git push origin deploy-logs --force
          else
            echo "deploy.log not found."
          fi



