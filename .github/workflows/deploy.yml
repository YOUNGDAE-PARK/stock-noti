name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Create Production .env file
        run: |
          echo "DATABASE_PATH=/tmp/stock_noti.db" >> .env
          echo "REPORTS_DIR=/tmp/reports" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}" >> .env
          echo "SLACK_WEBHOOK_WEEKLY_URL=${{ secrets.SLACK_WEBHOOK_WEEKLY_URL }}" >> .env
          echo "SLACK_WEBHOOK_URGENT_URL=${{ secrets.SLACK_WEBHOOK_URGENT_URL }}" >> .env
          echo "DART_API_KEY=${{ secrets.DART_API_KEY }}" >> .env
          echo "NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}" >> .env
          echo "NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}" >> .env
          echo "KRX_API_KEY=${{ secrets.KRX_API_KEY }}" >> .env

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}'

      - name: Deploy to Firebase
        run: |
          echo "Starting Firebase deployment with official tools..."
          npx firebase-tools deploy --non-interactive --project stock-f2ee7 > deploy.log 2>&1
          status=$?
          
          # Print log to console for debugging
          cat deploy.log
          
          if [ $status -ne 0 ]; then
            echo "### ❌ Firebase Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "#### Error Log (Tail):" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
            tail -n 50 deploy.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            exit $status
          else
            echo "### 🎉 Firebase Deployment Succeeded!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Push Logs to git branch on failure
        if: failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b deploy-logs || git checkout deploy-logs
          if [ -f deploy.log ]; then
            cp deploy.log deploy-failed.log
            git add deploy-failed.log
            git commit -m "Chore: update deployment failure logs"
            git push origin deploy-logs --force
          else
            echo "deploy.log not found."
          fi



